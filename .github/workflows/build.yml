# Тесты на каждый push; Windows собирается на Linux (без cgo). Mac (значок требует cgo) — только для выпуска: тег v*
# или запуск вручную с номером версии (Actions → build → Run workflow, version «1.0.1»; тег и выпуск создаются сами,
# текст выпуска — releases/v<версия>.md). Минуты macOS в закрытом репозитории стоят в 10 раз дороже. Выпуск: три файла и SHA256SUMS — их сверяют
# хаб (little_7o7/src/lib/pc-release.ts), команда установки и автообновление программы.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Номер версии для выпуска, например 1.0.1 (пусто — только сборка)"
        required: false
        default: ""

env:
  VERSION: ${{ inputs.version || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '0.0.0-ci' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: GOOS=windows go vet ./...
      - run: go test -race -cover ./...
      - name: Сборка для Windows
        run: |
          VERSION="${VERSION#v}"
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -H windowsgui -X main.version=$VERSION" -o dist/LittleHub-windows-amd64.exe ./cmd/littlehub
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/

  mac:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - name: Сборка для Mac (Apple Silicon и Intel)
        run: |
          VERSION="${VERSION#v}"
          LDF="-s -w -X main.version=$VERSION"
          CGO_ENABLED=1 GOARCH=arm64 CC="clang -arch arm64" go build -trimpath -ldflags "$LDF" -o dist/LittleHub-darwin-arm64 ./cmd/littlehub
          CGO_ENABLED=1 GOARCH=amd64 CC="clang -arch x86_64" go build -trimpath -ldflags "$LDF" -o dist/LittleHub-darwin-amd64 ./cmd/littlehub
          # Своя подпись (ad-hoc): без неё Apple Silicon не запустит файл.
          codesign --force --sign - dist/LittleHub-darwin-arm64 dist/LittleHub-darwin-amd64
          ./dist/LittleHub-darwin-arm64 --self-test
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: dist/

  # Mac не собрался — выпуск всё равно выходит с файлом для Windows (хаб берёт то, что есть в SHA256SUMS).
  release:
    if: always() && needs.test.result == 'success' && (startsWith(github.ref, 'refs/tags/v') || inputs.version != '')
    needs: [test, mac]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Выпуск
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          FILES="$(ls LittleHub-windows-amd64.exe LittleHub-darwin-arm64 LittleHub-darwin-amd64 2>/dev/null)"
          sha256sum $FILES > SHA256SUMS
          cat SHA256SUMS
          TAG="v${VERSION#v}"
          NOTES=""
          [ -f "../releases/$TAG.md" ] && NOTES="$(cat "../releases/$TAG.md")"
          if [ -z "$NOTES" ] && [[ "$GITHUB_REF" == refs/tags/* ]]; then
            git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
            NOTES="$(git tag -l --format='%(contents)' "$TAG")"
          fi
          [ -n "$NOTES" ] || NOTES="Little Hub $TAG"
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Little Hub $TAG" --notes "$NOTES" \
            $FILES SHA256SUMS
